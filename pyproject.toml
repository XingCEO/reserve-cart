[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "reserve-cart"
version = "0.1.0"
description = "A self-hosted limited-stock pickup shop with expiring reservations and an order desk"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["Flask>=3.1.2,<4"]
[project.scripts]
reserve-cart = "reserve_cart.__main__:main"
[tool.setuptools.package-data]
reserve_cart = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.setuptools.packages.find]
include = ["reserve_cart*"]
