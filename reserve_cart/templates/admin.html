<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reserve Cart — Shop desk</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body data-page="admin"><header class="site-header"><a class="brand" href="/">stillday<span>↗</span><small>THE SHOP DESK</small></a><nav><a href="/">View storefront ↗</a><button id="admin-logout" hidden>Sign out</button></nav></header><main class="admin-main"><section id="admin-login"><p class="eyebrow">BEHIND THE COUNTER</p><h1>Welcome to<br><em>your shop desk.</em></h1><form id="admin-login-form"><label>Username<input name="username" value="admin" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="dark-button">Sign in →</button><p id="login-error" role="alert"></p></form></section><section id="admin-workspace" hidden><div class="section-title"><div><p class="eyebrow">SMALL SHOP. CLEAR PICTURE.</p><h1>Today at the desk.</h1></div><button id="refresh-desk" class="outline-button">Refresh ↻</button></div><div id="admin-notice" role="status" class="shop-notice" hidden></div><div id="admin-stats" class="admin-stats"></div><div class="desk-tabs"><button data-tab="orders" class="active">Orders</button><button data-tab="inventory">Inventory</button></div><section id="orders-panel"><div class="desk-heading"><h2>Orders & reservations</h2><label>Status<select id="status-filter"><option value="all">All orders</option><option value="reserved">Reserved</option><option value="paid">Paid</option><option value="ready">Ready</option><option value="collected">Collected</option><option value="expired">Expired</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Next step</th></tr></thead><tbody id="orders-body"></tbody></table></div></section><section id="inventory-panel" hidden><div class="desk-heading"><h2>The collection</h2><button id="new-product" class="dark-button">+ Add product</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Available</th><th>Actions</th></tr></thead><tbody id="inventory-body"></tbody></table></div></section></section></main><dialog id="modal"><button id="close-modal" class="close-button" aria-label="Close dialog">×</button><div id="modal-body"></div></dialog></body></html>
